# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

tone_instructions: >
  Professional, direct, and educational. Explain the problem, impact, and
  relevant Spring/Hibernate concept. Do not automatically provide full code.
  Explain reasoning, trade-offs, and possible approaches for the developer.
  
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  path_instructions:
    - path: "src/main/java/**/controller/**"
      instructions: |
        Review REST API design, validation, exception handling, and security boundaries.

        Check that:
        - Controllers do not expose JPA entities directly.
        - Response DTOs are used for API responses.
        - Request DTOs are validated appropriately.
        - Global exception handling is used consistently.
        - Collection/list endpoints use pagination when appropriate.
        - Public and protected endpoints are intentional and correctly secured.
        - HTTP status codes are appropriate.
        - Controllers remain thin and do not contain business logic.

    - path: "src/main/java/**/service/**"
      instructions: |
        Review service-layer responsibilities, transaction boundaries, business logic, and dependency injection.

        Check that:
        - @Transactional is applied at appropriate service boundaries.
        - Read-only operations use readOnly transactions when beneficial.
        - Multi-step write operations preserve atomicity.
        - Business logic is not unnecessarily duplicated.
        - Constructor injection is used.
        - Spring-managed beans are not manually instantiated.
        - Services do not become orchestration-heavy god classes.

        When identifying a problem, explain the transaction or architectural concept involved instead of providing the complete refactor.

    - path: "src/main/java/**/repository/**"
      instructions: |
        Review JPA/Hibernate query design, database access patterns, pagination, and query performance.

        CRITICAL:
        - Actively look for potential N+1 query problems.
        - Explain how the query execution may behave at runtime.
        - Consider EntityGraph, JOIN FETCH, DTO projections, dedicated queries, batching, or other appropriate strategies.
        - Do not assume one solution is universally correct.
        - Explain trade-offs between possible solutions.

        Also review:
        - Pagination correctness and sorting behavior.
        - Unnecessary eager fetching or inefficient joins.
        - Leading-wildcard LIKE searches when they may prevent efficient index usage.

    - path: "src/main/java/**/config/**"
      instructions: |
        Strictly review security and infrastructure configuration.

        Check:
        - CORS uses explicit origins and does not use wildcard origins.
        - Stateless JWT authentication is configured consistently.
        - CSRF is disabled only when the application's authentication model makes that appropriate.
        - JWT expiration is enforced.
        - Secrets are provided through environment variables.
        - Authentication and authorization rules are correctly separated.
        - Outbound HTTP clients have explicit connection and request/read timeouts.

    - path: "src/main/resources/application*.yml"
      instructions: |
        Audit configuration for:
        - Hardcoded secrets (JWT secrets, database passwords, API keys).
        - Environment-specific configuration mistakes.
        - Production settings accidentally inherited from development.
        
        Production must not use `ddl-auto: update`.

    - path: "src/test/**"
      instructions: |
        Review test quality and correctness.

        Check that:
        - JUnit 5 assertions are used instead of native Java assert statements.
        - Tests verify behavior rather than implementation details.
        - Edge cases and failure paths are covered.
        - Integration tests use Testcontainers appropriately when real infrastructure behavior matters.
        - Tests do not depend on brittle hardcoded identifiers.

chat:
  auto_reply: true

tools:
  pmd:
    enabled: true
  semgrep:
    enabled: true
  checkov:
    enabled: true
  actionlint:
    enabled: true
  fbinfer:
    enabled: true
    enable_java: true