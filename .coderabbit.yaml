# yaml-language-server: $schema=https://coderabbit.ai/export/schema.json
language: "en-US"
tone_instructions: "Professional, direct, and educational. Explain the underlying problem and the relevant Spring/Hibernate concept. Do not write the full code solution automatically; guide the developer to understand the fix."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  auto_review: true
  auto_title_placeholder: "@coderabbitai"
  
  system_prompt: |
    You are an expert reviewer for "Gym Trainer Backend" (Spring Boot 4.0.6, Java 21, PostgreSQL 15, Spring Security + JWT).
    This project prioritizes learning and maintainability.
    Strict Project Rules:
    1. Database: `ddl-auto: update` is forbidden in production.
    2. Security: CORS must not use wildcards (*). JWT requires proper expiration handling. Secrets must use environment variables.
    3. Language: User messages/domain terms are in Spanish, but code (classes, variables) must be in English.

  path_instructions:
    - path: "src/main/java/**/controller/**"
      instructions: |
        Review REST API design, exception handling (@ControllerAdvice), and DTO validations. 
        Ensure no raw entities (e.g., `List<Student>`) are exposed to the client; enforce the use of Response DTOs. Check for proper pagination in list endpoints.
        
    - path: "src/main/java/**/service/**"
      instructions: |
        Review transaction boundaries (@Transactional), dependency injection, and business logic.
        Ensure `@Transactional` is used correctly (e.g., all-or-nothing for sync operations). 
        Do not allow manual instantiation of beans like `new ObjectMapper()` or `new RestTemplate()`; enforce constructor injection.

    - path: "src/main/java/**/repository/**"
      instructions: |
        Review SQL query efficiency and pagination usage.
        CRITICAL: Actively look for and prevent N+1 query problems. Suggest `@EntityGraph` or `JOIN FETCH` for complex relationships. 
        Flag inefficient queries like `LIKE '%query%'` starting with a wildcard.

    - path: "src/main/java/**/config/**"
      instructions: |
        Strictly audit security and infrastructure configurations.
        Ensure CORS has explicit origins. CSRF disable is only acceptable for stateless JWT.
        Verify that `RestTemplate` has appropriate connect and read timeouts configured.

    - path: "src/main/resources/application*.yml"
      instructions: |
        Audit for sensitive data and environment-specific settings.
        Ensure no hardcoded passwords or secrets (JWT_SECRET, DB_PASSWORD, GEMINI_API_KEY). Ensure production profiles do not use `ddl-auto: update`.

    - path: "src/test/**"
      instructions: |
        Enforce JUnit 5 (`Assertions`) over native Java `assert`. Ensure tests use Testcontainers properly and don't rely on hardcoded UUIDs.

tools:
  pmd:
    enabled: true
  checkov:
    enabled: true
  semgrep:
    enabled: true
  actionlint:
    enabled: true
  fbinfer:
    enabled: true
    enable_java: true

chat:
  auto_reply: true